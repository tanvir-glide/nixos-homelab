name: Nix CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Flake metadata
        run: nix flake show

      - name: Flake check
        run: nix flake check
        
      - name: Check formatting
        run: nix run nixpkgs#nixfmt-rfc-style -- --check .

      - name: Lint (statix)
        run: nix run nixpkgs#statix check .

      - name: Dead code check (deadnix)
        run: nix run nixpkgs#deadnix .

      - name: Evaluate config
        run: nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel

      - name: Build system
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel